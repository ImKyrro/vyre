<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vyre Companion</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #101012;
      --surface-alt: #17171a;
      --surface-hover: #1c1c20;
      --border: #232327;
      --text: #f2f2f3;
      --dim: #9a9aa2;
      --faint: #5f5f68;
      --accent: #e5484d;
      --accent-hover: #f05a5f;
      --online: #3fb950;
      --studio: #d29922;
      --ingame: #4c8dff;
    }
    * { box-sizing: border-box; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; }
    body { width: 360px; max-height: 560px; overflow-y: auto; background: var(--bg); color: var(--text); }
    body::-webkit-scrollbar { width: 4px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .container { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
    .header { display: flex; align-items: center; justify-content: space-between; }
    .logo { font-weight: 800; font-size: 17px; letter-spacing: 1.2px; display: flex; align-items: center; gap: 6px; }
    .logo b { color: var(--accent); }
    .logo-ver { font-size: 9px; color: var(--faint); font-weight: 500; background: var(--surface-alt); padding: 2px 6px; border-radius: 4px; }
    .pill { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--dim); font-weight: 600; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
    .dot.on { background: var(--online); box-shadow: 0 0 6px rgba(63,185,80,.4); }
    .dot.off { background: var(--accent); }
    .tabs { display: flex; gap: 2px; background: var(--surface); border-radius: 10px; padding: 3px; border: 1px solid var(--border); }
    .tab { flex: 1; text-align: center; padding: 7px 0; font-size: 11px; font-weight: 700; color: var(--faint); border-radius: 8px; cursor: pointer; transition: all .15s; border: none; background: none; }
    .tab:hover { color: var(--dim); }
    .tab.active { background: var(--surface-alt); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
    .panel { display: none; flex-direction: column; gap: 10px; }
    .panel.active { display: flex; animation: fadeIn .15s ease; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
    .profile-card { display: flex; gap: 12px; align-items: center; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-alt); border: 2px solid var(--border); object-fit: cover; flex-shrink: 0; }
    .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
    .who .name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .who .handle { font-size: 11px; color: var(--dim); }
    .stats-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px; font-size: 10px; color: var(--dim); white-space: nowrap; }
    .chip b { color: var(--text); font-weight: 700; }
    .chip.robux b { color: var(--studio); }
    .group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--faint); font-weight: 800; }
    input[type="text"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 7px; font-size: 12px; outline: none; width: 100%; transition: border-color .15s; }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--faint); }
    .color-row { display: flex; align-items: center; gap: 8px; }
    input[type="color"] { -webkit-appearance: none; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; background: none; padding: 0; }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid var(--border); border-radius: 50%; }
    .color-text { font-size: 11px; color: var(--dim); font-family: "Consolas", monospace; }
    .btn { border: none; border-radius: 8px; padding: 10px; font-weight: 700; font-size: 12px; cursor: pointer; width: 100%; transition: all .15s; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn.primary:disabled { background: var(--surface-alt); color: var(--faint); cursor: not-allowed; }
    .btn.ghost { background: var(--surface-alt); border: 1px solid var(--border); color: var(--text); font-weight: 600; }
    .btn.ghost:hover { background: var(--surface-hover); }
    .btn.sm { padding: 7px 10px; font-size: 11px; width: auto; }
    .btn.danger { background: rgba(229,72,77,.12); border: 1px solid rgba(229,72,77,.25); color: var(--accent); }
    .btn.danger:hover { background: rgba(229,72,77,.2); }
    .row { display: flex; gap: 6px; }
    .row > * { flex: 1; }
    .status { padding: 8px 10px; border-radius: 7px; font-size: 11px; display: none; line-height: 1.4; word-break: break-word; }
    .status.success { background: rgba(63,185,80,.08); border: 1px solid rgba(63,185,80,.2); color: var(--online); display: block; }
    .status.error { background: rgba(229,72,77,.08); border: 1px solid rgba(229,72,77,.2); color: var(--accent); display: block; }
    .status.info { background: rgba(76,141,255,.08); border: 1px solid rgba(76,141,255,.2); color: var(--ingame); display: block; }
    .section-title { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--faint); font-weight: 800; }
    .divider { height: 1px; background: var(--border); margin: 2px 0; }
    .account-list { display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
    .account-list::-webkit-scrollbar { width: 3px; }
    .account-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .acc-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; transition: background .1s; }
    .acc-item:hover { background: var(--surface-alt); }
    .acc-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--border); }
    .acc-info { flex: 1; min-width: 0; }
    .acc-name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acc-user { font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .acc-count { font-size: 10px; color: var(--faint); text-align: center; padding: 6px; }
    .history-list { display: flex; flex-direction: column; gap: 4px; max-height: 160px; overflow-y: auto; }
    .history-list::-webkit-scrollbar { width: 3px; }
    .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .history-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; }
    .history-name { font-size: 11px; font-weight: 600; }
    .history-time { font-size: 10px; color: var(--faint); }
    .empty { text-align: center; padding: 16px; color: var(--faint); font-size: 11px; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    .toggle-label { font-size: 12px; font-weight: 600; }
    .toggle-desc { font-size: 10px; color: var(--faint); }
    .toggle { position: relative; width: 34px; height: 18px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 14px; cursor: pointer; transition: all .2s; }
    .toggle-slider::before { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--dim); left: 2px; top: 2px; transition: all .2s; }
    .toggle input:checked + .toggle-slider { background: var(--accent); border-color: var(--accent); }
    .toggle input:checked + .toggle-slider::before { background: #fff; transform: translateX(16px); }
    .badge { background: var(--accent); color: #fff; font-size: 9px; font-weight: 800; padding: 1px 5px; border-radius: 10px; margin-left: 4px; }
    .foot { text-align: center; font-size: 9px; color: var(--faint); padding: 4px 0 2px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
    .loading { animation: pulse 1.2s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><b>V</b>YRE <span class="logo-ver">1.1.1</span></div>
      <div class="pill"><span class="dot" id="vyreDot"></span><span id="vyreText">…</span></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="capture">Capture</button>
      <button class="tab" data-tab="accounts">Vault <span class="badge" id="accBadge">0</span></button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <div class="panel active" id="panel-capture">
      <div class="card profile-card">
        <img class="avatar" id="avatar" alt="">
        <div class="who">
          <div class="name" id="accName">Not logged in</div>
          <div class="handle" id="accHandle">Open roblox.com and sign in</div>
        </div>
      </div>
      <div class="stats-row" id="stats"></div>

      <div class="group">
        <label for="accountName">Save as</label>
        <input type="text" id="accountName" placeholder="Account nickname">
      </div>
      <div class="group">
        <label for="privateLink">Private Server Link (optional)</label>
        <input type="text" id="privateLink" placeholder="roblox.com/games/... or code">
      </div>
      <div class="row">
        <div class="group">
          <label for="proxy">Proxy</label>
          <input type="text" id="proxy" placeholder="host:port">
        </div>
        <div class="group" style="max-width:90px;">
          <label>Color</label>
          <div class="color-row">
            <input type="color" id="color" value="#e5484d">
            <span class="color-text" id="colorText">#e5484d</span>
          </div>
        </div>
      </div>

      <button id="captureBtn" class="btn primary">Save to Vyre</button>
      <div class="row">
        <button id="copyBtn" class="btn ghost">Copy Cookie</button>
        <button id="healthBtn" class="btn ghost">Check Health</button>
      </div>
      <div id="status" class="status"></div>

      <div class="section-title">Recent Captures</div>
      <div class="history-list" id="historyList">
        <div class="empty">No captures yet</div>
      </div>
    </div>

    <div class="panel" id="panel-accounts">
      <div class="row" style="align-items:center;">
        <div class="section-title" style="flex:1;">Saved in Vyre</div>
        <button class="btn ghost sm" id="refreshAccounts">Refresh</button>
      </div>
      <div class="card" style="display:flex; flex-direction:column; gap:6px; padding:10px;">
        <div class="group">
          <label for="launchGameInput">Quick Launch (Place ID / Private Server Link)</label>
          <input type="text" id="launchGameInput" placeholder="e.g. 2753915549">
        </div>
      </div>
      <div class="account-list" id="accountList">
        <div class="empty loading">Connecting to Vyre…</div>
      </div>
    </div>

    <div class="panel" id="panel-settings">
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Auto-Capture on Login</div>
          <div class="toggle-desc">Save session when you log in to Roblox</div>
        </div>
        <label class="toggle"><input type="checkbox" id="autoCapture"><span class="toggle-slider"></span></label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">Login Notifications</div>
          <div class="toggle-desc">Alert on Roblox login/logout</div>
        </div>
        <label class="toggle"><input type="checkbox" id="loginNotify" checked><span class="toggle-slider"></span></label>
      </div>
      <div class="divider"></div>
      <div class="row">
        <button class="btn ghost sm" id="clearHistoryBtn">Clear History</button>
        <button class="btn danger sm" id="clearAllBtn">Reset Extension</button>
      </div>
    </div>

    <div class="foot">Vyre Companion — Kyrro</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
